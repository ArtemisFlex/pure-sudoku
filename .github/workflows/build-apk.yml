name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PureSudoku.apk

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureSudoku-apk
          path: PureSudoku.apk

      # A release gives a direct .apk download link that works from a phone browser.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pure Sudoku build ${{ github.run_number }}
          body: Tap PureSudoku.apk below to download, then open it to install.
          files: PureSudoku.apk
